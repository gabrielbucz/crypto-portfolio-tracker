<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <title>Portfólio - CryptoTracker</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <picture>
                <source srcset="../assets/img/cryptotracker-logo.webp" type="image/webp">

                <img src="../assets/img/cryptotracker-logo.webp" alt="Logo do site" class="hero-img" loading="lazy">
            </picture>
            <a class="navbar-brand" href="#">CryptoTracker</a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div id="menu" class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="favoritos.html">Favoritos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="portfolio.html">Portfólio</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">

        <!-- FORMULÁRIO -->
        <div class="card crypto-card shadow-sm border-0 mb-4 p-3">
            <h6 class="fw-bold mb-3 text-dark">Adicionar Transação</h6>
            <div class="row g-2 row-cols-2 row-cols-md-3 row-cols-lg-5 align-items-end">

                <div class="col">
                    <label class="form-label-custom">Moeda</label>
                    <select id="select-moeda" class="form-select form-select-sm">
                        <option>Carregando...</option>
                    </select>
                </div>

                <div class="col">
                    <label class="form-label-custom">Quantidade</label>
                    <input id="input-quantidade" type="number" min="0" step="any" class="form-control form-control-sm"
                        placeholder="0.00">
                </div>

                <div class="col">
                    <label class="form-label-custom">Preço (USD)</label>
                    <input id="input-preco" type="number" min="0" step="any" class="form-control form-control-sm"
                        placeholder="Preço pago">
                </div>

                <div class="col">
                    <label class="form-label-custom">Data</label>
                    <input id="input-data" type="date" class="form-control form-control-sm">
                </div>

                <div class="col-12 col-lg">
                    <button id="btn-adicionar" class="btn btn-primary btn-sm w-100">Adicionar</button>
                </div>
            </div>
        </div>

        <!-- CARDS RESUMO -->
        <div class="row g-3 mb-4">
            <div class="col-12 col-md-4">
                <div class="card p-3 h-100">
                    <small class="text-muted">VALOR TOTAL</small>
                    <h5 id="resumo-valor" class="fw-bold mb-0">$ 0.00</h5>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card p-3 h-100">
                    <small class="text-muted">LUCRO / PREJUÍZO (24H)</small>
                    <h5 id="resumo-lucro" class="fw-bold mb-0 text-muted">$ 0.00</h5>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card p-3 h-100">
                    <small class="text-muted">MOEDAS ATIVAS</small>
                    <h5 id="resumo-moedas" class="fw-bold mb-0">0</h5>
                </div>
            </div>
        </div>

        <!-- TABELA (md+) -->
        <div class="card crypto-card border-0 shadow-sm p-4 d-none d-md-block">
            <h6 class="fw-bold mb-4">Minhas Criptomoedas</h6>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th class="border-0 text-muted small">MOEDA</th>
                            <th class="border-0 text-muted small text-end">QUANTIDADE</th>
                            <th class="border-0 text-muted small text-end">PREÇO MÉDIO</th>
                            <th class="border-0 text-muted small text-end">VALOR ATUAL</th>
                            <th class="border-0 text-muted small text-center">LUCRO/PREJUÍZO</th>
                            <th class="border-0 text-muted small text-center">AÇÕES</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-portfolio">
                        <tr>
                            <td colspan="6" class="text-center text-muted py-4">
                                Nenhuma transação registrada ainda.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- CARDS MOBILE (< md) -->
        <div id="cards-portfolio-mobile" class="d-md-none">
            <p class="text-muted text-center py-4">Nenhuma transação registrada ainda.</p>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/portfolio.js"></script>
</body>

</html>
