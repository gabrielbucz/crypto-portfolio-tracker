<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <title>Portfólio - CryptoTracker</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="#">CryptoTracker</a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div id="menu" class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="favoritos.html">Favoritos</a></li>
                    <li class="nav-item"><a class="nav-link" href="portfolio.html">Portfólio</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container my-4">

        <div class="card crypto-card shadow-sm border-0 mb-4 p-3">
            <h6 class="fw-bold mb-3 text-dark">Adicionar Transação</h6>

            <div class="row g-2 row-cols-2 row-cols-md-3 row-cols-lg-5 align-items-end">

                <div class="col">
                    <label class="form-label-custom">Moeda</label>
                    <select class="form-select form-select-sm">
                        <option selected>BTC</option>
                        <option value="1">ETH</option>
                    </select>
                </div>

                <div class="col">
                    <label class="form-label-custom">Quantidade</label>
                    <input type="number" class="form-control form-control-sm" placeholder="0.00">
                </div>

                <div class="col">
                    <label class="form-label-custom">Preço (USD)</label>
                    <input type="number" class="form-control form-control-sm" placeholder="Preço">
                </div>

                <div class="col">
                    <label class="form-label-custom">Data</label>
                    <input type="date" class="form-control form-control-sm">
                </div>

                <div class="col-12 col-lg">
                    <button class="btn btn-primary btn-sm w-100">Adicionar</button>
                </div>
            </div>
        </div>


        <div class="row mb-4 ">
            <div class="col-md-4 ">
                <div class="card p-3 mb-2">
                    <small>VALOR TOTAL</small>
                    <h5 class="fw-bold">$ 9,227.00</h5>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3 mb-2">
                    <small>LUCRO / PREJUÍZO (24H)</small>
                    <h5 class="text-success fw-bold">+ $ 82.30</h5>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3 mb-2">
                    <small>MOEDAS ATIVAS</small>
                    <h5 class="fw-bold">4</h5>
                </div>
            </div>
        </div>

        <div class="card crypto-card border-0 shadow-sm p-4">
            <h6 class="fw-bold mb-4">Minhas Criptomoedas</h6>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th class="border-0 text-muted small">MOEDA</th>
                            <th class="border-0 text-muted small text-end">QUANTIDADE</th>
                            <th class="border-0 text-muted small text-end">PREÇO MÉDIO</th>
                            <th class="border-0 text-muted small text-end">VALOR ATUAL</th>
                            <th class="border-0 text-muted small text-center">LUCRO/PREJUÍZO</th>
                        </tr>
                    </thead>
                    <tbody class="border-top-0">
                        <tr>
                            <td>
                                <div class="d-flex align-items-center">
                                    <img src="../assets/btc.png" width="24" class="me-2" alt="">
                                    <div>
                                        <span class="fw-bold d-block">Bitcoin</span>
                                        <small class="text-muted">BTC</small>
                                    </div>
                                </div>
                            </td>
                            <td class="text-end fw-medium">0.15 BTC</td>
                            <td class="text-end">$ 42,000.00</td>
                            <td class="text-end fw-bold">$ 9,450.00</td>
                            <td class="text-center">
                                <span class="badge rounded-pill bg-success-subtle text-success px-3">+ 15.2%</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

</body>


<script type="module" src="../js/main.js"></script>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
