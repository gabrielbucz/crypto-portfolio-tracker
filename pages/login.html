<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Faça login na sua conta CryptoTracker e acompanhe o mercado crypto em tempo real." />

    <title>Login — CryptoTracker</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet" />

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />

    <!-- Estilos da página de login -->
    <link rel="stylesheet" href="../assets/css/login.css" />
</head>

<body>

    <!-- ── Cena de fundo ───────────────────────────────────────────────── -->
    <div class="bg-scene" aria-hidden="true">
        <div class="bg-grid"></div>
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="bg-orb bg-orb-3"></div>
        <div class="particles" id="particles"></div>
    </div>

    <!-- ── Tela de autenticação ────────────────────────────────────────── -->
    <main class="auth-screen" role="main">
        <div class="auth-card">

            <!-- Cabeçalho / Branding -->
            <header class="auth-header">
                <a href="index.html" class="brand" aria-label="Ir para o início do CryptoTracker">
                    <div class="brand-icon" aria-hidden="true">
                        <i class="bi bi-graph-up-arrow"></i>
                    </div>
                    <span class="brand-name">Crypto<span>Tracker</span></span>
                </a>

                <h1 class="auth-title" id="formTitle">Entrar na conta</h1>
                <p class="auth-subtitle" id="formSubtitle">Acompanhe o mercado crypto em tempo real.</p>

                <!-- Tickers decorativos -->
                <div class="ticker-bar" aria-hidden="true">
                    <span class="ticker-badge up"><i class="bi bi-caret-up-fill"></i>BTC +2.4%</span>
                    <span class="ticker-badge up"><i class="bi bi-caret-up-fill"></i>ETH +1.8%</span>
                    <span class="ticker-badge down"><i class="bi bi-caret-down-fill"></i>BNB −0.6%</span>
                </div>
            </header>

            <!-- Mensagens globais de feedback -->
            <div id="globalError" class="global-message error hidden" role="alert" aria-live="assertive">
                <i class="bi bi-exclamation-circle-fill" aria-hidden="true"></i>
                <span></span>
            </div>

            <div id="globalSuccess" class="global-message success hidden" role="status" aria-live="polite">
                <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
                <span></span>
            </div>

            <!-- Formulário -->
            <form id="authForm" class="auth-form" novalidate aria-label="Formulário de autenticação">

                <!-- Campo: Nome (apenas no cadastro) -->
                <div class="field-group hidden" id="nameGroup">
                    <label class="field-label" for="inputName">
                        <i class="bi bi-person" aria-hidden="true"></i>
                        Nome completo
                    </label>
                    <div class="input-wrapper">
                        <i class="bi bi-person input-icon" aria-hidden="true"></i>
                        <input id="inputName" type="text" class="field-input" name="name"
                            placeholder="Seu nome completo" autocomplete="name" aria-describedby="nameError"
                            aria-required="false" />
                    </div>
                    <span id="nameError" class="field-error" role="alert"></span>
                </div>

                <!-- Campo: E-mail -->
                <div class="field-group">
                    <label class="field-label" for="inputEmail">
                        <i class="bi bi-envelope" aria-hidden="true"></i>
                        E-mail
                    </label>
                    <div class="input-wrapper">
                        <i class="bi bi-envelope input-icon" aria-hidden="true"></i>
                        <input id="inputEmail" type="email" class="field-input" name="email" placeholder="seu@email.com"
                            autocomplete="email" inputmode="email" aria-describedby="emailError" aria-required="true" />
                    </div>
                    <span id="emailError" class="field-error" role="alert"></span>
                </div>

                <!-- Campo: Senha -->
                <div class="field-group">
                    <label class="field-label" for="inputPassword">
                        <i class="bi bi-lock" aria-hidden="true"></i>
                        Senha
                    </label>
                    <div class="input-wrapper">
                        <i class="bi bi-lock input-icon" aria-hidden="true"></i>
                        <input id="inputPassword" type="password" class="field-input has-toggle" name="password"
                            placeholder="Mínimo 6 caracteres" autocomplete="current-password" minlength="6"
                            aria-describedby="passwordError" aria-required="true" />
                        <button type="button" id="togglePassword" class="btn-eye" aria-label="Mostrar ou ocultar senha"
                            title="Mostrar/ocultar senha">
                            <i id="eyeIcon" class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    <span id="passwordError" class="field-error" role="alert"></span>
                </div>

                <!-- Link: Esqueci minha senha -->
                <div class="forgot-link" id="forgotLink">
                    <a href="#" aria-label="Recuperar acesso à conta">Esqueci minha senha</a>
                </div>

                <!-- Botão de submit -->
                <button type="submit" id="btnSubmit" class="btn-auth" disabled aria-label="Entrar na conta">
                    <span id="btnSpinner" class="spinner hidden" aria-hidden="true"></span>
                    <span id="btnText">Entrar</span>
                    <i class="bi bi-arrow-right" aria-hidden="true"></i>
                </button>

            </form>

            <!-- Toggle: Login ↔ Cadastro -->
            <p class="auth-toggle" id="toggleMode">
                Não tem conta? <a id="toggleLink" href="#">Criar agora</a>
            </p>

        </div><!-- /auth-card -->

        <!-- Footer discreto -->
        <footer class="auth-footer">
            <p>
                © 2024 CryptoTracker &nbsp;·&nbsp;
                <a href="#">Termos</a> &nbsp;·&nbsp;
                <a href="#">Privacidade</a>
            </p>
            <p style="margin-top: 0.3rem; font-size: 0.65rem; opacity: 0.6;">
                Dados fictícios para fins de demonstração.
            </p>
        </footer>

    </main>

    <!-- Script de partículas + módulo principal -->
    <script>
        // Gera partículas flutuantes no fundo
        (function () {
            const container = document.getElementById('particles');
            const count = 18;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('span');
                p.className = 'particle';
                const size = Math.random() * 3 + 1.5;
                p.style.cssText = `
          width: ${size}px;
          height: ${size}px;
          left: ${Math.random() * 100}%;
          animation-duration: ${Math.random() * 18 + 14}s;
          animation-delay: ${Math.random() * -20}s;
          opacity: ${Math.random() * 0.4 + 0.1};
        `;
                container.appendChild(p);
            }
        })();
    </script>

    <!-- Módulo JS de autenticação -->
    <script type="module" src="../js/login.js"></script>

</body>

</html>
